<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pure CSS Scroll Animated Light Mask</title>
  <style>
    :root {
      --bg-color: #0d0d11;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .section {
      position: relative;
      width: 100%;
      min-height: 80vh;
      padding: 4rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .section-tall {
      min-height: 140vh;
    }

    /* 1. MASK CONTAINER 
       Acts as the frame for the lines. */
    .masked-light {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    /* 2. THE GLOWING ELEMENT (Pseudo-element)
       Fixed to the viewport so it flows continuously across sections as you scroll. */
    .masked-light::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 50vw;
      height: 50vw;
      margin-top: -25vw;
      margin-left: -25vw;
      border-radius: 50%;
      background: radial-gradient(circle at center, #00f2fe 0%, #4facfe 40%, #7928ca 70%, transparent 100%);
      filter: blur(30px);
      will-change: transform;

      /* Pure CSS Scroll Timeline linked to page scroll */
      animation: moveAndScaleGlow linear both;
      animation-timeline: scroll(root block);
    }

    /* Scroll Animation Keyframes */
    @keyframes moveAndScaleGlow {
      0% {
        transform: translate(0, -35vh) scale(0.6);
        opacity: 0.5;
      }
      50% {
        transform: translate(12vw, 0) scale(1.6);
        opacity: 1;
      }
      100% {
        transform: translate(-10vw, 35vh) scale(0.8);
        opacity: 0.4;
      }
    }

    /* 3. SECTION MASKS
       vector-effect="non-scaling-stroke" keeps the 2px line thickness crisp 
       regardless of dynamic section height! */

    /* 1. Single Vertical Line Mask */
    .mask-single-line {
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="0" x2="50" y2="100" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="0" x2="50" y2="100" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
    }

    /* 2. Box Frame Line Mask */
    .mask-box {
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="10" y="10" width="80" height="80" fill="none" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="10" y="10" width="80" height="80" fill="none" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
    }

    /* 3. Zigzag Line Pattern Mask */
    .mask-zigzag {
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 10 0 L 90 25 L 10 50 L 90 75 L 10 100" fill="none" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 10 0 L 90 25 L 10 50 L 90 75 L 10 100" fill="none" stroke="%23ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 500px;
      text-align: center;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #a0a5b5;
    }
  </style>
</head>
<body>

  <!-- Section 1: Single Line -->
  <section class="section">
    <div class="masked-light mask-single-line"></div>
    <div class="content">
      <h2>Section 1</h2>
      <p>Single vertical line revealing the scroll-animated light blob.</p>
    </div>
  </section>

  <!-- Section 2: Box Outline -->
  <section class="section section-tall">
    <div class="masked-light mask-box"></div>
    <div class="content">
      <h2>Section 2</h2>
      <p>Taller section content framed by a box mask line...</p>
    </div>
  </section>

  <!-- Section 3: Zigzag Pattern -->
  <section class="section section-tall">
    <div class="masked-light mask-zigzag"></div>
    <div class="content">
      <h2>Section 3</h2>
      <p>Zigzag line mask with dynamic section height.</p>
    </div>
  </section>

</body>
</html>
